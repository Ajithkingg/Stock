<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>AK_Tech</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f5;--card:#ffffff;--ink:#14201d;--muted:#5f6f6a;--line:#e1e7e4;
  --brand:#0f766e;--brand-text:#0f766e;--brand-ink:#ffffff;--brand-soft:#e3f2ef;--danger:#c2410c;--danger-soft:#fdeee6;
  --good:#15803d;--warn:#b45309;--warn-soft:#fdf3e1;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1513;--card:#17201e;--ink:#e6eeeb;--muted:#93a39e;--line:#26332f;
  --brand:#2bb3a3;--brand-text:#2bb3a3;--brand-ink:#04211d;--brand-soft:#173430;--danger:#f08a5d;--danger-soft:#3a2219;
  --good:#4ade80;--warn:#f5b04a;--warn-soft:#3a2c14;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0e1513;--card:#17201e;--ink:#e6eeeb;--muted:#93a39e;--line:#26332f;
  --brand:#2bb3a3;--brand-text:#2bb3a3;--brand-ink:#04211d;--brand-soft:#173430;--danger:#f08a5d;--danger-soft:#3a2219;
  --good:#4ade80;--warn:#f5b04a;--warn-soft:#3a2c14;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .lang{background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:6px 12px;color:inherit;font-weight:600}
main{padding:14px 16px 96px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11.5px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--brand-text);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.hl{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.stat.hl .k{color:inherit;opacity:.85}
h2{font-size:15px;margin:18px 2px 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.list .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--danger-soft);color:var(--danger)}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:600;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.ghost{background:var(--brand-soft);color:var(--brand-text)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:var(--brand)}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:38px;background:var(--card)}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;white-space:nowrap;font-size:13.5px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--brand-soft);color:var(--brand-text);width:34px;height:34px;font-size:18px;font-weight:700}
.qty input{width:52px;border:0;border-radius:0;text-align:center;padding:6px 2px;background:transparent}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--brand-text);box-shadow:var(--shadow)}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.tot.big{font-size:20px;font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);padding:14px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;gap:6px;align-items:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw}
.bar{height:8px;background:var(--brand-soft);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--brand)}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#fff;color:#000;padding:14px;border-radius:10px;border:1px solid var(--line)}
.receipt .c{text-align:center}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:2px 0;vertical-align:top}
.receipt .r{text-align:right}
.receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
.menu .item{cursor:pointer}
.muted{color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:10px}
.sw{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw.custom{background:conic-gradient(#e11d48,#f59e0b,#16a34a,#0891b2,#4f46e5,#c026d3,#e11d48)}
.picker{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.picker input[type=range]{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;padding:0;border:0;margin:6px 0 2px}
.picker input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #333;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.preview{display:flex;align-items:center;gap:10px;margin-top:10px}
.preview i{width:44px;height:44px;border-radius:12px;display:block;border:1px solid var(--line)}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:72mm}
  #printArea .receipt{border:0;padding:0}
}
</style>
</head>

/* ---------- data ---------- */
function fresh(){return {settings:{shop:'My Store',addr:'',phone:'',gstin:'',footer:'Thank you! Visit again.',lang:'en',gstOn:false,billNo:1,theme:'auto',color:'#0f766e'},products:[],sales:[],log:[]}}
const NB=()=>window.AndroidBridge&&window.AndroidBridge.readData?window.AndroidBridge:null;  /* native storage (APK) */
function parseDb(txt){try{const d=JSON.parse(txt);if(d&&d.products&&d.settings&&d.sales)return d}catch(e){}return null}
function load(){
  let local=null,nat=null;
  try{local=parseDb(localStorage.getItem(KEY)||localStorage.getItem('kadaibook_v1'))}catch(e){}
  try{if(NB())nat=parseDb(NB().readData())}catch(e){}
  /* use whichever copy was saved most recently */
  const d=(local&&nat)?((nat.savedAt||0)>(local.savedAt||0)?nat:local):(local||nat);
  return d||fresh();
}
let db=load();
function save(){

const PALETTE=['#0f766e','#15803d','#0369a1','#1d4ed8','#4338ca','#7e22ce','#be185d','#b91c1c','#c2410c','#b45309','#7c4a2d','#334155','#111827'];
const hexRgb=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return isNaN(n)||h.length!==6?null:[n>>16&255,n>>8&255,n&255]};
const rgbHex=c=>'#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
function hslHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rgbHex([f(0)*255,f(8)*255,f(4)*255])}
function hexHsl(hex){let[r,g,b]=hexRgb(hex)||[15,118,110];r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[Math.round(h),Math.round(s*100),Math.round(l*100)]}
const isDarkMode=()=>{const th=db.settings.theme||'auto';return th==='dark'||(th==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)};
function applyTheme(){
  const th=db.settings.theme||'auto',root=document.documentElement;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  const base=hexRgb(db.settings.color)||hexRgb('#0f766e'),dark=isDarkMode();
  let brand=base;
  if(dark&&lum(base)<.18)brand=mix(base,[255,255,255],.45);            /* lift dark colours so they read on a dark screen */
  const brandHex=rgbHex(brand),ink=lum(brand)>.42?'#13201d':'#ffffff';
  const soft=dark?mix([23,32,30],brand,.25):mix([255,255,255],brand,.13);
  const text=dark?brandHex:rgbHex(lum(base)>.42?mix(base,[0,0,0],.45):base); /* brand text must stay readable on light cards */
  root.style.setProperty('--brand',brandHex);root.style.setProperty('--brand-ink',ink);
  root.style.setProperty('--brand-soft',rgbHex(soft));root.style.setProperty('--brand-text',text);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=brandHex;
  try{window.AndroidBridge&&window.AndroidBridge.setStatusBarColor&&window.AndroidBridge.setStatusBarColor(brandHex,ink!=='#ffffff')}catch(e){}
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme())}catch(e){}

function stockForm(id){
  const p=pById(id);
  sheet(`<h3>${t('addStock')}</h3><div class="s">${esc(p.name)} · ${qtyFmt(p.stock)} ${esc(p.unit)} ${t('inStock')}</div>
  <label>${t('qty')} (${esc(p.unit)})</label><input id="sQty" type="number" inputmode="decimal" step="any">
  <label>${t('purchaseCost')} / ${esc(p.unit)}</label><input id="sCost" type="number" inputmode="decimal" step="any" value="${p.buy}">
  <label>${t('note')}</label><input id="sNote" placeholder="Supplier / invoice">
  <div class="f2" style="margin-top:16px"><button class="btn ghost" onclick="closeSheet()">${t('cancel')}</button><button class="btn" id="sSave">${t('save')}</button></div>`,
  ()=>{$('#sQty').focus();$('#sSave').onclick=()=>{
    const q=parseFloat($('#sQty').value);if(!q){$('#sQty').focus();return}
    const c=parseFloat($('#sCost').value);
    if(c>=0&&c!==p.buy&&q>0){const oldQ=Math.max(0,p.stock);p.buy=r2((oldQ*p.buy+q*c)/(oldQ+q))} /* weighted average cost */
    p.stock=r2(p.stock+q);
    db.log.push({id:uid(),date:Date.now(),pid:id,qty:q,type:'stockIn',note:$('#sNote').value.trim()});
    save();closeSheet();toast(t('saved'));render();
  }});
}
async function delProduct(id){if(!await ask(t('confirmDelete'),t('delete')))return;db.products=db.products.filter(p=>p.id!==id);cart=cart.filter(c=>c.pid!==id);save();closeSheet();render()}

/* ---------- BILLING ---------- */
function cartTotals(){
  const sub=r2(cart.reduce((a,c)=>a+c.price*c.qty,0));
  const disc=Math.min(sub,r2(billMeta.disc));
  const tax=db.settings.gstOn?r2(cart.reduce((a,c)=>a+c.price*c.qty*(c.gst||0)/100,0)*(sub?(sub-disc)/sub:0)):0;
  return {sub,disc,tax,total:r2(sub-disc+tax)};
}
function addToCart(pid){
  const p=pById(pid);const c=cart.find(x=>x.pid===pid);
  if(c)c.qty=r2(c.qty+1);else cart.push({pid,name:p.name,unit:p.unit,price:p.sell,buy:p.buy,gst:p.gst||0,qty:1});
  renderBill();
}
function vBilling(v){
  v.innerHTML=`<div class="search">${I.search}<input id="bq" placeholder="${t('search')}" value="${esc(billQ)}" autocomplete="off"></div>
  <div id="bRes"></div><div id="bCart"></div>`;
  const bq=$('#bq');bq.oninput=()=>{billQ=bq.value;renderResults()};
  bq.onkeydown=e=>{if(e.key==='Enter'){const m=matchProducts();if(m.length){addToCart(m[0].id);billQ='';bq.value='';renderResults()}}};
  renderResults();renderBill();
}
function matchProducts(){const q=billQ.toLowerCase().trim();
  let ps=db.products.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase()===q||(p.code||'').toLowerCase().includes(q));
  return ps.sort((a,b)=>a.name.localeCompare(b.name))}
function renderResults(){
  const ps=matchProducts().slice(0,billQ?20:12);
  $('#bRes').innerHTML=db.products.length?`<div class="chips" style="flex-wrap:wrap;overflow:visible">${ps.map(p=>`<button class="chip" data-add="${p.id}" style="${p.stock<=0?'opacity:.55':''}">${esc(p.name)} · <b>${money(p.sell)}</b></button>`).join('')}</div>`:
    `<div class="card empty">${t('noProducts')}<br><br><button class="btn ghost" data-go="products">${t('addProduct')}</button></div>`;
  $('#bRes').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(b.dataset.add));
}
function renderBill(){
  const el=$('#bCart');if(!el)return;
  if(!cart.length){el.innerHTML=db.products.length?`<div class="card empty">${t('cartEmpty')}</div>`:'';return}
  const tt=cartTotals();
  el.innerHTML=`<div class="card list">${cart.map((c,i)=>`

function receiptText(s){

function receiptCanvas(s,k=1){
  const st=db.settings,W=576,pad=24,lh=30,c=document.createElement('canvas'),x=c.getContext('2d');
  const lines=[];const add=(l,r='',o={})=>lines.push({l,r,...o});
  add(st.shop,'',{c:1,b:1,big:1});(st.addr||'').split('\n').filter(Boolean).forEach(a=>add(a,'',{c:1}));
  if(st.phone)add('Ph: '+st.phone,'',{c:1});if(st.gstin)add('GSTIN: '+st.gstin,'',{c:1});
  add('-','',{hr:1});add('Bill #'+s.no,fmtDate(s.date));if(s.cust)add(s.cust+(s.phone?' · '+s.phone:''));add('-','',{hr:1});
  s.items.forEach(i=>{add(i.name,'',{b:1});add(`  ${qtyFmt(i.qty)} ${i.unit} x ${r2(i.price)}`,r2(i.price*i.qty).toFixed(2))});
  add('-','',{hr:1});add('Subtotal',s.sub.toFixed(2));if(s.disc)add('Discount','-'+s.disc.toFixed(2));if(s.tax)add('GST',s.tax.toFixed(2));
  add('TOTAL','₹'+s.total.toFixed(2),{b:1,big:1});add('Paid by',s.pay.toUpperCase());
  if(s.cancelled)add('*** CANCELLED ***','',{c:1,b:1});add('-','',{hr:1});add(st.footer||'','',{c:1});
  c.width=W*k;c.height=(pad*2+lines.length*lh+10)*k;x.scale(k,k);x.fillStyle='#fff';x.fillRect(0,0,W,c.height/k);x.fillStyle='#000';x.textBaseline='top';
  lines.forEach((ln,k)=>{const y=pad+k*lh;
    if(ln.hr){x.setLineDash([6,5]);x.beginPath();x.moveTo(pad,y+lh/2);x.lineTo(W-pad,y+lh/2);x.stroke();x.setLineDash([]);return}
    x.font=`${ln.b?'bold ':''}${ln.big?26:21}px "Noto Sans Tamil",system-ui,sans-serif`;
    if(ln.c){x.textAlign='center';x.fillText(ln.l,W/2,y,W-pad*2)}else{x.textAlign='left';x.fillText(ln.l,pad,y,W-pad*2-(ln.r?150:0));if(ln.r){x.textAlign='right';x.fillText(ln.r,W-pad,y)}}});
  return c;
}
/* Bill as PDF: receipt drawn on canvas, embedded as a JPEG page (80 mm wide). Works offline, keeps Tamil text. */
function canvasToPdf(cv){
  const jpg=atob(cv.toDataURL('image/jpeg',0.92).split(',')[1]);
  const img=new Uint8Array(jpg.length);for(let i=0;i<jpg.length;i++)img[i]=jpg.charCodeAt(i);
  const W=226.77, H=r2(W*cv.height/cv.width); /* 80 mm in points */
  const enc=new TextEncoder(), parts=[], offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n');(Array.isArray(body)?body:[body]).forEach(push);push('\nendobj\n')};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  obj(4,[`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`,img,'\nendstream']);
  const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const x=len;push('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join(''));
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function saveToPhone(name,blob,mime){
  if(window.AndroidBridge&&window.AndroidBridge.saveFile){try{const r=window.AndroidBridge.saveFile(name,await blobB64(blob),mime);if(r)toast('Save failed: '+r)}catch(e){toast('Save failed: '+e)}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast(t('saved'));
}
function billFileName(s){

function billPdf(s){return canvasToPdf(receiptCanvas(s,2))}
const isNative=()=>!!window.AndroidBridge||!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const blobB64=blob=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(blob)});
async function saveOrShareFile(name,blob,mime,text){
  /* 0) AK_Tech Android app: hand the file to Android's share menu */
  if(window.AndroidBridge){try{const r=window.AndroidBridge.shareFile(name,await blobB64(blob),mime,text||'');if(r)toast('Share failed: '+r)}catch(e){toast('Share failed: '+e)}return}
  /* 1) Android APK (Capacitor): write to cache and open share sheet */
  if(isNative()){try{const P=window.Capacitor.Plugins;const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(blob)});
    const w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await P.Share.share({title:name,text:text||'',url:w.uri,dialogTitle:name});return}catch(e){if(String(e).includes('cancel'))return;console.warn(e)}}
  /* 2) browser share with files */
  try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name,text:text||''});return}}catch(e){if(e.name==='AbortError')return}
  /* 3) download */
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

function rangeBounds(){
  const now=new Date();let from=0,to=Infinity;
  if(repRange==='today'){from=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()}
  else if(repRange==='week'){from=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6).getTime()}
  else if(repRange==='month'){from=new Date(now.getFullYear(),now.getMonth(),1).getTime()}
  else if(repRange==='custom'){from=repFrom?new Date(repFrom+'T00:00').getTime():0;to=repTo?new Date(repTo+'T23:59:59').getTime():Infinity}
  return [from,to];
}

  <label>${t('language')}</label><div class="seg" id="sLang"><button data-l="en" class="${s.lang==='en'?'on':''}">English</button><button data-l="ta" class="${s.lang==='ta'?'on':''}">தமிழ்</button></div>
  <label>${t('theme')}</label><div class="seg" id="sTheme">${['auto','light','dark'].map(m=>`<button data-th="${m}" class="${(s.theme||'auto')===m?'on':''}">${t(m)}</button>`).join('')}</div>
  <label>${t('themeColor')}</label>
  <div class="swatches" id="sColors">${PALETTE.map(c=>`<button class="sw ${(s.color||'').toLowerCase()===c?'on':''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}
    <button class="sw custom ${PALETTE.includes((s.color||'').toLowerCase())?'':'on'}" id="swCustom" aria-label="${t('customColor')}"></button></div>
  <div class="picker" id="picker" hidden>
    <div class="t">${t('customColor')}</div>
    <label>${t('hue')}</label><input type="range" id="pH" min="0" max="359">
    <label>${t('sat')}</label><input type="range" id="pS" min="0" max="100">
    <label>${t('shade')}</label><input type="range" id="pL" min="10" max="85">
    <div class="preview"><i id="pPrev"></i><input id="pHex" maxlength="7" style="width:120px;font-family:ui-monospace,monospace" autocomplete="off"><button class="btn sm" id="pApply">${t('save')}</button></div>
  </div>
  <button class="btn block" style="margin-top:18px" id="sSave">${t('save')}</button></div>
  <div class="card"><div class="s">${t('dataOnPhone')}</div><div class="f2" style="margin-top:10px"><button class="btn ghost" onclick="doBackup()">${t('backup')}</button><button class="btn ghost" onclick="$('#fileIn').click()">${t('restore')}</button></div>
  <button class="btn danger block" style="margin-top:10px" onclick="resetAll()">${t('resetAll')}</button></div>`;
  $('#sSave').onclick=()=>{Object.assign(s,{shop:$('#sShop').value.trim()||APP_NAME,addr:$('#sAddr').value.trim(),phone:$('#sPhone').value.trim(),gstin:$('#sGstin').value.trim(),footer:$('#sFooter').value.trim(),gstOn:$('#sGst').checked});save();toast(t('saved'));render()};
  v.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{s.lang=b.dataset.l;save();render()});
  v.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{s.theme=b.dataset.th;save();render()});
  const setColor=c=>{s.color=c;save();applyTheme();v.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c||(b.id==='swCustom'&&!PALETTE.includes(c))))};
  v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{setColor(b.dataset.c);$('#picker').hidden=true});
  const pH=$('#pH'),pS=$('#pS'),pL=$('#pL'),pHex=$('#pHex'),pPrev=$('#pPrev');
  const paintTracks=()=>{const h=+pH.value,sa=+pS.value,l=+pL.value;
    pH.style.background='linear-gradient(90deg,'+[0,60,120,180,240,300,359].map(x=>hslHex(x,sa||60,l)).join(',')+')';
    pS.style.background=`linear-gradient(90deg,${hslHex(h,0,l)},${hslHex(h,100,l)})`;
    pL.style.background=`linear-gradient(90deg,${hslHex(h,sa,10)},${hslHex(h,sa,48)},${hslHex(h,sa,85)})`};
  const fromSliders=()=>{const c=hslHex(+pH.value,+pS.value,+pL.value);pHex.value=c;pPrev.style.background=c;paintTracks()};
  const toSliders=c=>{const[h,sa,l]=hexHsl(c);pH.value=h;pS.value=sa;pL.value=Math.max(10,Math.min(85,l));pHex.value=c;pPrev.style.background=c;paintTracks()};
  [pH,pS,pL].forEach(r=>r.oninput=fromSliders);
  pHex.oninput=()=>{let c=pHex.value.trim();if(!c.startsWith('#'))c='#'+c;if(hexRgb(c)){pPrev.style.background=c;const[h,sa,l]=hexHsl(c);pH.value=h;pS.value=sa;pL.value=l;paintTracks()}};
  $('#swCustom').onclick=()=>{const pk=$('#picker');pk.hidden=!pk.hidden;toSliders(s.color||'#0f766e')};
  $('#pApply').onclick=()=>{let c=pHex.value.trim().toLowerCase();if(!c.startsWith('#'))c='#'+c;if(!hexRgb(c)){toast('#RRGGBB');return}setColor(c.length===4?rgbHex(hexRgb(c)):c);toast(t('saved'))};
}
async function resetAll(){if(!await ask(t('confirmReset'),t('resetAll')))return;const lang=db.settings.lang;db=fresh();db.settings.lang=lang;cart=[];save();go('home')}

/* ---------- BACKUP / EXPORT ---------- */
function doBackup(){db.settings.lastBackup=Date.now();save();const name=`AK_Tech-backup-${dayKey(Date.now())}.json`;const b=new Blob([JSON.stringify(db)],{type:'application/json'});if(window.AndroidBridge)saveToPhone(name,b,'application/json');else saveOrShareFile(name,b,'application/json',name)}
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.products||!d.settings||!d.sales)throw 0;db=d;db.log=db.log||[];save();toast(t('restored'));go('home')}catch(_){toast(t('badFile'))}};fr.readAsText(f);e.target.value=''};
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function csv(name,rows){saveOrShareFile(name,new Blob(['﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n')],{type:'text/csv'}),'text/csv',name)}
function exportSalesCsv(){const rows=[['Bill No','Date','Customer','Phone','Item','Qty','Unit','Price','Amount','Cost','Payment','Bill Total','Status']];
  db.sales.forEach(s=>s.items.forEach(i=>rows.push([s.no,fmtDate(s.date),s.cust,s.phone,i.name,i.qty,i.unit,i.price,r2(i.qty*i.price),r2(i.qty*i.buy),s.pay,s.total,s.cancelled?'Cancelled':'OK'])));
  csv(`sales-${dayKey(Date.now())}.csv`,rows)}
function exportStockCsv(){const rows=[['Product','Category','Code','Unit','Purchase Price','Selling Price','GST %','Stock','Stock Value (cost)']];
  db.products.forEach(p=>rows.push([p.name,p.cat,p.code,p.unit,p.buy,p.sell,p.gst,p.stock,r2(Math.max(0,p.stock)*p.buy)]));csv(`stock-${dayKey(Date.now())}.csv`,rows)}

  const S=[['Rice (Ponni)','Grocery','kg',52,60,80,10],['Toor Dal','Grocery','kg',120,140,25,5],['Sugar','Grocery','kg',40,46,40,10],['Sunflower Oil 1L','Grocery','pcs',125,145,30,6],
  ['Tea Powder 250g','Beverages','pcs',95,110,20,5],['Milk 500ml','Dairy','pcs',24,27,40,10],['Bath Soap','Personal care','pcs',32,40,48,12],['Toothpaste 150g','Personal care','pcs',85,99,15,4],

/* ---------- global events ---------- */
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){closeSheet();go(g.dataset.go)}});
$('#langBtn').onclick=()=>{db.settings.lang=db.settings.lang==='en'?'ta':'en';save();render()};
/* Android back button (AK_Tech APK) */
window.onAndroidBack=()=>{const dlg=[...document.querySelectorAll('.sheet-bg')].pop();if(dlg)dlg.remove();else if(route!=='home')go(['reports','settings'].includes(route)?'more':'home');else window.AndroidBridge&&window.AndroidBridge.exit()};
/* Android back button inside APK */
document.addEventListener('DOMContentLoaded',()=>{try{const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  A&&A.addListener('backButton',()=>{if($('#sheetBg'))closeSheet();else if(route!=='home')go(['reports','settings'].includes(route)?'more':'home');else A.exitApp()})}catch(e){}});
if('serviceWorker' in navigator && location.protocol==='https:' && !isNative()){navigator.serviceWorker.register('sw.js').catch(()=>{})}
/* ---------- automatic updates (APK) ----------
   Publish a corrected index.html + version.json at UPDATE_URL. Phones download it in the
   background and switch to it; customer data stays. A broken update is rolled back automatically. */
const cmpVer=(a,b)=>{a=String(a).split('.').map(Number);b=String(b).split('.').map(Number);for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
let updating=false;
async function checkUpdate(manual){
  const B=window.AndroidBridge;if(!B||!B.saveUpdate||updating||UPDATE_URL.includes('UPDATE-HOST'))return manual&&toast(t('upToDate'));
  updating=true;
  try{
    const info=await (await fetch(UPDATE_URL+'version.json?t='+Date.now(),{cache:'no-store'})).json();
    if(!(cmpVer(info.version,APP_VERSION)>0)||info.version===B.badVersion()){if(manual)toast(t('upToDate'));return}
    const html=await (await fetch(UPDATE_URL+'index.html?t='+Date.now(),{cache:'no-store'})).text();
    if(!html.includes("const APP_VERSION = '"+info.version+"'")||!html.includes('</html>'))throw new Error('bad file');
    const r=B.saveUpdate(html,String(info.version));if(r)throw new Error(r);
    save();  /* make sure the latest data is in the app's file copy before switching */
    sheet(`<h3>${t('updated')} v${esc(info.version)}</h3>${info.notes?`<p class="s">${t('whatsNew')}: ${esc(info.notes)}</p>`:''}
      <button class="btn block" style="margin-top:12px" onclick="location.replace(AndroidBridge.updatedUrl())">${t('restartNow')}</button>`);
  }catch(e){if(manual)toast(navigator.onLine?('Update failed: '+e.message):t('noNet'))}
  finally{updating=false}
}
render();
try{window.AndroidBridge&&window.AndroidBridge.bootOk&&window.AndroidBridge.bootOk()}catch(e){}
setTimeout(()=>checkUpdate(false),4000);
</script>
